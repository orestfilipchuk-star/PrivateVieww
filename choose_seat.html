{% extends "base.html" %}

{% block content %}
<div class="seat-selection-container">
    <h2 class="seat-title">Выберите место для фильма: {{ movie }}</h2>

    <form id="seatForm">
        <input type="hidden" name="movie" value="{{ movie }}">

        <div class="seats-row">
            <label><input type="radio" name="seat" id="A1"> A1</label>
            <label><input type="radio" name="seat" id="A2"> A2</label>
            <label><input type="radio" name="seat" id="A3"> A3</label>
            <label><input type="radio" name="seat" id="A4"> A4</label>
            <label><input type="radio" name="seat" id="A5"> A5</label>
        </div>

        <div class="seats-row">
            <label><input type="radio" name="seat" id="B1"> B1</label>
            <label><input type="radio" name="seat" id="B2"> B2</label>
            <label><input type="radio" name="seat" id="B3"> B3</label>
            <label><input type="radio" name="seat" id="B4"> B4</label>
            <label><input type="radio" name="seat" id="B5"> B5</label>
        </div>

        <button type="button" id="confirmButton" class="btn">Подтвердить выбор</button>
    </form>
</div>

<!-- Модальное окно -->
<div id="confirmationModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Подтвердите бронь</h2>
        <p id="modalMovie"></p>
        <p id="modalSeat"></p>
        <form id="bookingForm" action="{{ url_for('submit_booking') }}" method="POST">
            <input type="hidden" id="selectedSeat" name="seat">
            <input type="hidden" id="selectedMovie" name="movie">
            <label for="email">Электронная почта:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            <label for="telegram">Ваш тег Telegram:</label>
            <input type="text" id="telegram" name="telegram" placeholder="@username" required>
            <button type="submit" class="btn">Отправить</button>
        </form>
    </div>
</div>

<style>
.seat-selection-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    margin-top: 40px;
}
.seat-title {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 30px;
}
.seats-row {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 15px;
}
.seats-row label {
    font-size: 18px;
}

/* Модальное окно */
.modal {
    display: none;
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
}
.modal-content {
    background:#1e1e1e;
    padding:30px;
    border-radius:15px;
    width:400px;
    max-width:90%;
    text-align:center;
}
.close {float:right; font-size:24px; cursor:pointer;}
.modal-content label, .modal-content input {display:block; width:100%; margin-bottom:10px; font-size:16px;}
</style>

<script>
const modal = document.getElementById("confirmationModal");
const closeBtn = document.querySelector(".modal .close");
const confirmBtn = document.getElementById("confirmButton");

confirmBtn.addEventListener("click", function() {
    const seatRadio = document.querySelector('input[name="seat"]:checked');
    if(!seatRadio){
        alert("Сначала выберите место!");
        return;
    }

    const seatId = seatRadio.id;
    const movieName = "{{ movie }}";

    document.getElementById("selectedSeat").value = seatId;
    document.getElementById("selectedMovie").value = movieName;

    document.getElementById("modalMovie").innerText = "Фильм: " + movieName;
    document.getElementById("modalSeat").innerText = "Место: " + seatId;

    modal.style.display = "flex";
});

closeBtn.addEventListener("click", function(){ modal.style.display = "none"; });
window.addEventListener("click", function(e){ if(e.target==modal) modal.style.display="none"; });
</script>
{% endblock %}
